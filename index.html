<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070914"><title>وسيم عبدالواسع | Product Engineer</title><style>html,body{margin:0;height:100%;display:grid;place-items:center;background:#070914;color:#f5f7ff;font-family:system-ui}.l{text-align:center}.s{width:54px;height:54px;margin:auto;border:2px solid #252b44;border-top-color:#4fe1c1;border-radius:50%;animation:r .8s linear infinite}p{color:#aab2c8;font-size:13px}@keyframes r{to{transform:rotate(360deg)}}</style></head><body><div class="l"><div class="s"></div><p>نبني تجربة وسيم...</p></div><script>(async()=>{const n=7,a=await Promise.all([...Array(n)].map((_,i)=>fetch('chunks/'+i+'.txt').then(r=>{if(!r.ok)throw Error('chunk '+i);return r.text()}))),p=a.join(''),b=Uint8Array.from(atob(p),c=>c.charCodeAt(0));let h;if('DecompressionStream'in window){const s=new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'));h=await new Response(s).text()}else{await new Promise((ok,no)=>{const x=document.createElement('script');x.src='https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js';x.onload=ok;x.onerror=no;document.head.appendChild(x)});h=new TextDecoder().decode(pako.ungzip(b))}document.open();document.write(h);document.close()})().catch(e=>{document.body.innerHTML='<div class="l"><h1>تعذر التحميل</h1><p>أعد فتح الصفحة أو استخدم متصفحًا حديثًا.</p></div>';console.error(e)});</script></body></html>
